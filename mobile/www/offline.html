<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumio Tennis Coach</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080F; color: #F4F7FB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; box-sizing: border-box; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 800; }
  p { font-size: 15px; line-height: 1.55; color: #93A1B5; margin: 0 0 26px; max-width: 300px; }
  button { appearance: none; border: 0; border-radius: 12px; background: #3A8EE0; color: #fff; font-size: 16px; font-weight: 700; padding: 14px 28px; font-family: inherit; }
  button:active { opacity: .8; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>You’re offline</h1>
  <p>Lumio Tennis Coach needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="retry()">Try again</button>
</main>
<script>
  function retry() { window.location.href = 'https://www.lumiosports.com/app' }
  window.addEventListener('online', retry)
</script>
</body>
</html>
