# The native Lumio Tennis Coach iPhone app (SwiftUI). Generate the Xcode
# project with:  brew install xcodegen  &&  cd native && xcodegen
name: LumioCoach
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB
settings:
  base:
    DEVELOPMENT_TEAM: 5UD3D95Y4M
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LumioCoach:
    type: application
    platform: iOS
    sources:
      - path: LumioCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumiosports.tenniscoach
        PRODUCT_NAME: LumioCoach
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Lumio Coach
    info:
      path: LumioCoach/Info.plist
      properties:
        CFBundleDisplayName: Lumio Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Lumio uses the camera so you can take photos and videos of lessons and add them to a player's profile.
        NSMicrophoneUsageDescription: Lumio uses the microphone so you can record a lesson or a voice note for its summary.
        NSPhotoLibraryUsageDescription: Lumio opens your photo library so you can add photos and videos to lessons, profiles and messages.
        NSPhotoLibraryAddUsageDescription: Lumio saves photos and certificates you choose to keep to your photo library.
    entitlements:
      path: LumioCoach/LumioCoach.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:www.lumiosports.com
